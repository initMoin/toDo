org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Room's KSP integration currently registers generated sources through the
# legacy Kotlin source-set hook; keep built-in Kotlin enabled while allowing
# that generated source registration to complete.
android.disallowKotlinSourceSets=false
